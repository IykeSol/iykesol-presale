<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iykesol | The Future of Ethereum DeFi</title>
    <meta
      name="description"
      content="Join the iykesol presale on Ethereum Sepolia. Buy $IYKESOL tokens with your wallet."
    />

    <!-- Preconnect to font origins for faster DNS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: synchronous to prevent CLS -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=block&display=swap"
      rel="stylesheet"
    />

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- Background glows -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- Header (rendered by layout.js) -->
    <header id="app-header"></header>

    <!-- Pages -->
    <main>
      <section id="home" class="page active"></section>
      <section id="about" class="page"></section>
      <section id="roadmap" class="page"></section>
      <section id="buy" class="page"></section>
    </main>

    <!-- Mobile bottom nav (rendered by layout.js) -->
    <nav id="bottom-nav"></nav>

    <!-- Footer (rendered by layout.js) -->
    <footer id="app-footer"></footer>

    <!-- State & wallet (no ethers yet – loads lazily on Connect) -->
    <script src="js/store.js" defer></script>

    <!-- Page modules -->
    <script src="js/pages/home.js" defer></script>
    <script src="js/pages/about.js" defer></script>
    <script src="js/pages/roadmap.js" defer></script>
    <script src="js/pages/buy.js" defer></script>

    <!-- Layout & navigation -->
    <script src="js/layout.js" defer></script>
    <script src="js/router.js" defer></script>

    <!-- App entry point -->
    <script src="js/app.js" defer></script>
  </body>
</html>
